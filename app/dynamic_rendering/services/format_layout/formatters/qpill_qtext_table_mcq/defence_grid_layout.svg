<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reference diagram only — not imported or read by any Python module.

  Full-slide comparison for qpill_qtext_table_mcq on the "defence" template
  (dspec.has_top_banner() == True). Every box below is drawn from the real
  EMU coordinates in constants.py (QUESTION_PILL, QUESTION_LABEL,
  QUESTION_TEXT, TABLE_BOX, OPTION_[A-D]_PILL/TEXT), scaled 1000px = slide
  width (36,576,000 EMU), so proportions match the actual output.

  LEFT panel  — today: banner reserves space, but options still stack in one
                column, unshifted in x — option D's answer box runs past the
                bottom of the slide.
  RIGHT panel — proposed: same pill/text/table, options regrouped into a
                2-column grid (A/B row 0, C/D row 1) with halved-width answer
                boxes — everything fits, with room to spare.

  Every other template (no title banner) keeps today's single-column layout
  unchanged; this diagram only concerns the defence-template path.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2280 740" font-family="IBM Plex Mono, Menlo, monospace">
  <defs>
    <style>
      .ink    { fill:#211a16; }
      .muted  { fill:#8a7f72; }
      .accent { fill:#ff0000; }
      .slide-bg   { fill:#141312; }
      .pill-fill  { fill:#8e0000; }
      .pill-line  { stroke:#ff0000; stroke-width:2; }
      .box-line   { stroke:#ffffff; stroke-width:1.2; stroke-dasharray:5 4; fill:none; opacity:0.85; }
      .box-line-solid { stroke:#ffffff; stroke-width:1.2; fill:none; opacity:0.9; }
      .box-label  { fill:#efe9e0; font-size:9px; }
      .table-line { stroke:#efe9e0; stroke-width:1; opacity:0.6; }
      .banner     { fill:#8e0000; opacity:0.30; }
      .banner-line{ stroke:#ff0000; stroke-width:1.2; stroke-dasharray:4 3; fill:none; }
      .overflow-box { stroke:#ff3b30; stroke-width:1.6; stroke-dasharray:5 4; fill:#ff3b30; fill-opacity:0.12; }
      .free-box   { stroke:#2fae5a; stroke-width:1.4; stroke-dasharray:5 4; fill:#2fae5a; fill-opacity:0.08; }
    </style>
  </defs>

  <rect x="0" y="0" width="2280" height="740" fill="#f6f3ee"/>

  <text x="40" y="34" font-size="17" font-weight="700" class="ink">qpill_qtext_table_mcq &#8212; full slide, defence template</text>
  <text x="40" y="54" font-size="12" class="muted">every box scaled from the real EMU coordinates in constants.py &#183; slide canvas 36,576,000 &#215; 20,574,000 EMU (40in &#215; 22.5in)</text>

  <!-- ======================================================================
       LEFT PANEL — today (single column, options overflow the slide)
       ====================================================================== -->
  <g transform="translate(40,80)">
    <text x="60" y="0" font-size="14" font-weight="600" class="ink">Today &#8212; single column</text>
    <text x="60" y="17" font-size="11" class="muted">banner reserved, but options never left the single-column layout</text>

    <g transform="translate(60,30)">
      <rect x="0" y="0" width="1000" height="562.5" class="slide-bg" rx="4"/>

      <!-- title banner (reserved by the title emitter, not this formatter) -->
      <rect x="0" y="0" width="1000" height="54.99" class="banner"/>
      <rect x="0" y="0" width="1000" height="54.99" class="banner-line"/>
      <text x="500" y="31" text-anchor="middle" font-size="11" fill="#ffd7d7">title banner (reserved space, 2,011,320 EMU)</text>

      <!-- question pill (bleeds off left edge by design) -->
      <rect x="-50.98" y="73.63" width="193.62" height="42.92" rx="10" class="pill-fill" stroke="#ff0000" stroke-width="1.5"/>
      <rect x="28.42" y="77.6" width="124.73" height="27.77" class="box-line"/>
      <text x="35" y="94" class="box-label">Question</text>

      <!-- question text -->
      <rect x="30.21" y="122.56" width="950" height="70" class="box-line"/>
      <text x="38" y="140" class="box-label">Question text (wrap + shrink-to-fit)</text>

      <!-- table -->
      <rect x="30.21" y="204.74" width="950" height="125.1" class="box-line-solid"/>
      <text x="38" y="220" class="box-label">Table (5 &#215; 2 on reference slide)</text>
      <line x1="30.21" y1="246.9" x2="980.21" y2="246.9" class="table-line"/>
      <line x1="30.21" y1="271.06" x2="980.21" y2="271.06" class="table-line"/>
      <line x1="30.21" y1="295.22" x2="980.21" y2="295.22" class="table-line"/>
      <line x1="30.21" y1="313.38" x2="980.21" y2="313.38" class="table-line"/>
      <line x1="410" y1="204.74" x2="410" y2="329.84" class="table-line"/>

      <!-- options A-D, single column -->
      <g>
        <circle cx="50.26" cy="387.78" r="21.84" class="pill-fill" stroke="#ff0000" stroke-width="1.6"/>
        <text x="50.26" y="393" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">A</text>
        <rect x="84.96" y="373.89" width="895.24" height="43.67" class="box-line"/>

        <circle cx="50.26" cy="445.66" r="21.84" class="pill-fill" stroke="#ff0000" stroke-width="1.6"/>
        <text x="50.26" y="451" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">B</text>
        <rect x="84.96" y="430.14" width="895.24" height="43.67" class="box-line"/>

        <circle cx="50.26" cy="503.56" r="21.84" class="pill-fill" stroke="#ff0000" stroke-width="1.6"/>
        <text x="50.26" y="509" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">C</text>
        <rect x="84.96" y="486.64" width="895.24" height="43.67" class="box-line"/>

        <!-- D overflows the slide bottom (562.5) -->
        <circle cx="50.26" cy="561.43" r="21.84" class="pill-fill" stroke="#ff0000" stroke-width="1.6"/>
        <text x="50.26" y="567" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">D</text>
        <rect x="84.96" y="545.04" width="895.24" height="43.67" class="overflow-box"/>
      </g>

      <!-- slide edge, drawn last so the overflow is visibly outside it -->
      <rect x="0" y="0" width="1000" height="562.5" fill="none" stroke="#211a16" stroke-width="2"/>
    </g>

    <text x="60" y="618" font-size="12" fill="#c0392b" font-weight="600">&#9888; option D's answer box (y 545&#8211;589) runs past the slide's bottom edge (562.5)</text>
    <text x="60" y="636" font-size="11" class="muted">same x/width for every row, only y increases &#8212; the banner pushed the whole block down until it no longer fits.</text>
  </g>

  <!-- ======================================================================
       RIGHT PANEL — proposed (2-column grid, defence only)
       ====================================================================== -->
  <g transform="translate(1160,80)">
    <text x="60" y="0" font-size="14" font-weight="600" class="ink">Proposed &#8212; 2-column grid</text>
    <text x="60" y="17" font-size="11" fill="#c0392b">defence template only &#183; dspec.has_top_banner() == True</text>

    <g transform="translate(60,30)">
      <rect x="0" y="0" width="1000" height="562.5" class="slide-bg" rx="4"/>

      <!-- title banner -->
      <rect x="0" y="0" width="1000" height="54.99" class="banner"/>
      <rect x="0" y="0" width="1000" height="54.99" class="banner-line"/>
      <text x="500" y="31" text-anchor="middle" font-size="11" fill="#ffd7d7">title banner (reserved space, 2,011,320 EMU)</text>

      <!-- question pill (unchanged) -->
      <rect x="-50.98" y="73.63" width="193.62" height="42.92" rx="10" class="pill-fill" stroke="#ff0000" stroke-width="1.5"/>
      <rect x="28.42" y="77.6" width="124.73" height="27.77" class="box-line"/>
      <text x="35" y="94" class="box-label">Question</text>

      <!-- question text (unchanged) -->
      <rect x="30.21" y="122.56" width="950" height="70" class="box-line"/>
      <text x="38" y="140" class="box-label">Question text (wrap + shrink-to-fit)</text>

      <!-- table (unchanged) -->
      <rect x="30.21" y="204.74" width="950" height="125.1" class="box-line-solid"/>
      <text x="38" y="220" class="box-label">Table (5 &#215; 2 on reference slide)</text>
      <line x1="30.21" y1="246.9" x2="980.21" y2="246.9" class="table-line"/>
      <line x1="30.21" y1="271.06" x2="980.21" y2="271.06" class="table-line"/>
      <line x1="30.21" y1="295.22" x2="980.21" y2="295.22" class="table-line"/>
      <line x1="30.21" y1="313.38" x2="980.21" y2="313.38" class="table-line"/>
      <line x1="410" y1="204.74" x2="410" y2="329.84" class="table-line"/>

      <!-- options A-D, 2-column grid -->
      <g>
        <!-- row 0: A | B -->
        <circle cx="50.26" cy="387.78" r="21.84" class="pill-fill" stroke="#ff0000" stroke-width="1.6"/>
        <text x="50.26" y="393" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">A</text>
        <rect x="84.96" y="373.89" width="410.04" height="43.67" class="box-line"/>

        <circle cx="526.84" cy="387.78" r="21.84" class="pill-fill" stroke="#ff0000" stroke-width="1.6"/>
        <text x="526.84" y="393" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">B</text>
        <rect x="561.54" y="373.89" width="408.25" height="43.67" class="box-line"/>

        <!-- row 1: C | D -->
        <circle cx="50.26" cy="445.66" r="21.84" class="pill-fill" stroke="#ff0000" stroke-width="1.6"/>
        <text x="50.26" y="451" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">C</text>
        <rect x="84.96" y="430.14" width="410.04" height="43.67" class="box-line"/>

        <circle cx="526.84" cy="445.66" r="21.84" class="pill-fill" stroke="#ff0000" stroke-width="1.6"/>
        <text x="526.84" y="451" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">D</text>
        <rect x="561.54" y="430.14" width="408.25" height="43.67" class="box-line"/>

        <!-- column gap marker -->
        <line x1="505" y1="373.89" x2="505" y2="473.81" stroke="#efe9e0" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

        <!-- ghost row 2: E | F, only if 5+ options -->
        <g opacity="0.5">
          <circle cx="50.26" cy="503.56" r="21.84" fill="none" stroke="#efe9e0" stroke-width="1.6" stroke-dasharray="3 3"/>
          <text x="50.26" y="509" text-anchor="middle" font-size="14" font-weight="600" fill="#efe9e0">E</text>
          <rect x="84.96" y="486.64" width="410.04" height="43.67" fill="none" stroke="#efe9e0" stroke-width="1" stroke-dasharray="3 3"/>

          <circle cx="526.84" cy="503.56" r="21.84" fill="none" stroke="#efe9e0" stroke-width="1.6" stroke-dasharray="3 3"/>
          <text x="526.84" y="509" text-anchor="middle" font-size="14" font-weight="600" fill="#efe9e0">F</text>
          <rect x="561.54" y="486.64" width="408.25" height="43.67" fill="none" stroke="#efe9e0" stroke-width="1" stroke-dasharray="3 3"/>
        </g>
        <text x="500" y="470" text-anchor="middle" font-size="9.5" fill="#c9bfae">row 2, only if a slide has 5+ options</text>

        <!-- freed space -->
        <rect x="84.96" y="486.64" width="884.83" height="65" class="free-box"/>
        <rect x="84.96" y="486.64" width="884.83" height="65" fill="none"/>
        <text x="527" y="558" text-anchor="middle" font-size="11.5" fill="#2fae5a" font-weight="600">freed vertical space &#8212; comfortably inside the slide</text>
      </g>

      <rect x="0" y="0" width="1000" height="562.5" fill="none" stroke="#211a16" stroke-width="2"/>
    </g>

    <text x="60" y="618" font-size="12" fill="#1e7a42" font-weight="600">&#10003; A/B on row 0, C/D on row 1 &#8212; everything sits inside the slide with room left over</text>
    <text x="60" y="636" font-size="11" class="muted">answer box width halved (&#8776;16.4in / &#8776;16.3in, mirrored margins) &#8212; same split qpill_qtext_image_mcq already uses for its image column.</text>
  </g>

  <text x="40" y="700" font-size="11" class="muted">gated by dspec.has_top_banner() &#183; touches only qpill_qtext_table_mcq/constants.py, formatter.py and shared/mcq_option_layout.py &#183; every other template keeps the left layout unchanged</text>
</svg>
