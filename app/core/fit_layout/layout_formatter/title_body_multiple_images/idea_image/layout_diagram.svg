<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- CASE 1: 2 IMAGES (left column) -->
  <rect x="20" y="20" width="560" height="860" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <text x="300" y="50" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">2 Images: Square (40% each)</text>

  <!-- Slide canvas -->
  <rect x="30" y="70" width="540" height="800" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Heading pill -->
  <rect x="55" y="90" width="350" height="45" rx="6" fill="#015500" stroke="#999" stroke-width="1"/>
  <text x="230" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="white">HEADING</text>

  <!-- Body textbox (left) -->
  <rect x="55" y="150" width="280" height="700" rx="3" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="170" font-size="12" font-weight="bold" fill="#2563eb">BODY TEXT</text>
  <text x="70" y="190" font-size="10" fill="#666">• Bullet point 1</text>
  <text x="70" y="210" font-size="10" fill="#666">• Bullet point 2</text>
  <text x="70" y="230" font-size="10" fill="#666">• (wraps naturally)</text>

  <!-- Image 1 box (top-right, ~40% height) -->
  <rect x="345" y="150" width="220" height="280" rx="3" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="455" cy="260" r="35" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="455" cy="265" font-size="11" text-anchor="middle" fill="#666">Image 1</text>
  <text x="345" y="437" font-size="10" fill="#ea580c" font-weight="500">~40% (square)</text>

  <!-- Image 2 box (bottom-right, ~40% height) -->
  <rect x="345" y="440" width="220" height="280" rx="3" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="455" cy="550" r="35" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="455" cy="555" font-size="11" text-anchor="middle" fill="#666">Image 2</text>
  <text x="345" y="728" font-size="10" fill="#ea580c" font-weight="500">~40% (square)</text>

  <text x="455" y="780" font-size="9" text-anchor="middle" fill="#999" font-style="italic">(extra space below)</text>

  <!-- CASE 2: 3+ IMAGES (right column) -->
  <rect x="620" y="20" width="560" height="860" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <text x="900" y="50" font-size="18" font-weight="bold" text-anchor="middle" fill="#000">3+ Images: Equal Height</text>

  <!-- Slide canvas -->
  <rect x="630" y="70" width="540" height="800" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Heading pill -->
  <rect x="655" y="90" width="350" height="45" rx="6" fill="#015500" stroke="#999" stroke-width="1"/>
  <text x="830" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="white">HEADING</text>

  <!-- Body textbox (left) -->
  <rect x="655" y="150" width="280" height="700" rx="3" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="670" y="170" font-size="12" font-weight="bold" fill="#2563eb">BODY TEXT</text>
  <text x="670" y="190" font-size="10" fill="#666">• Bullet point 1</text>
  <text x="670" y="210" font-size="10" fill="#666">• Bullet point 2</text>
  <text x="670" y="230" font-size="10" fill="#666">• (wraps naturally)</text>

  <!-- Image 1 box (33% height) -->
  <rect x="945" y="150" width="220" height="225" rx="3" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="1055" cy="235" r="20" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1055" cy="240" font-size="9" text-anchor="middle" fill="#666">Image 1</text>
  <text x="945" y="373" font-size="9" fill="#ea580c" font-weight="500">33% h</text>

  <!-- Image 2 box (33% height) -->
  <rect x="945" y="380" width="220" height="226" rx="3" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="1055" cy="465" r="20" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1055" cy="470" font-size="9" text-anchor="middle" fill="#666">Image 2</text>
  <text x="945" y="613" font-size="9" fill="#ea580c" font-weight="500">33% h</text>

  <!-- Image 3 box (33% height) -->
  <rect x="945" y="610" width="220" height="240" rx="3" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="1055" cy="705" r="20" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1055" cy="710" font-size="9" text-anchor="middle" fill="#666">Image 3</text>
  <text x="945" y="860" font-size="9" fill="#ea580c" font-weight="500">33% h</text>

  <!-- Legend -->
  <g transform="translate(20, 880)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="30" y="5" font-size="11" fill="#000">Body textbox (left, unchanged)</text>

    <line x1="420" y1="0" x2="440" y2="0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="450" y="5" font-size="11" fill="#000">Image boxes (stacked, aspect-ratio preserved)</text>
  </g>
</svg>
