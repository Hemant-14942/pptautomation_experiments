<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#f5f5f5"/>

  <!-- Slide Canvas (40" × 22.5") -->
  <rect x="20" y="20" width="760" height="410" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Title/Heading Pill (Green rounded bar at top) -->
  <rect x="45" y="40" width="380" height="50" rx="8" fill="#015500" stroke="#999" stroke-width="1"/>
  <text x="235" y="72" font-size="16" font-weight="bold" text-anchor="middle" fill="white">HEADING PILL</text>
  <text x="235" y="28" font-size="11" text-anchor="middle" fill="#666" font-weight="500">Title Box (Don't Touch)</text>

  <!-- Body Content Textbox (Full width-ish, left side) -->
  <rect x="45" y="115" width="710" height="290" rx="4" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="135" font-size="13" font-weight="bold" fill="#2563eb">BODY CONTENT TEXTBOX (Full-width, Vertically Centered)</text>
  <text x="60" y="160" font-size="11" fill="#666">• Bullet point 1</text>
  <text x="60" y="180" font-size="11" fill="#666">• Bullet point 2</text>
  <text x="60" y="250" font-size="11" fill="#666" text-anchor="middle">↕ Content centers vertically ↕</text>
  <text x="60" y="310" font-size="10" fill="#888">Size: 32" × 19"</text>
  <text x="60" y="328" font-size="10" fill="#888">Position: 1" from left, 5.15" from top</text>
  <text x="60" y="346" font-size="10" fill="#888">Anchor: center (ctr) — 2 lines or 5 lines, always centered</text>

  <!-- Dimension Lines & Labels -->
  <!-- Left margin -->
  <line x1="20" y1="115" x2="45" y2="115" stroke="#999" stroke-width="1"/>
  <text x="25" y="110" font-size="9" fill="#999" font-weight="500">1"</text>

  <!-- Gap between heading and body -->
  <line x1="20" y1="105" x2="20" y2="115" stroke="#999" stroke-width="1"/>
  <line x1="30" y1="105" x2="30" y2="115" stroke="#999" stroke-width="1"/>
  <text x="10" y="112" font-size="9" fill="#999">0.55"</text>

  <!-- Width indicator -->
  <line x1="45" y1="405" x2="755" y2="405" stroke="#999" stroke-width="1"/>
  <line x1="45" y1="400" x2="45" y2="410" stroke="#999" stroke-width="1"/>
  <line x1="755" y1="400" x2="755" y2="410" stroke="#999" stroke-width="1"/>
  <text x="400" y="420" font-size="10" text-anchor="middle" fill="#999" font-weight="500">32" (80% of slide width)</text>

  <!-- Legend -->
  <g transform="translate(20, 430)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#000">Legend:</text>

    <!-- Body textbox legend -->
    <line x1="0" y1="15" x2="20" y2="15" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="30" y="19" font-size="11" fill="#000">Body (32" wide, vertically centered)</text>

    <!-- Green heading -->
    <rect x="450" y="8" width="15" height="15" fill="#015500"/>
    <text x="470" y="19" font-size="11" fill="#000">Heading (unchanged)</text>
  </g>
</svg>