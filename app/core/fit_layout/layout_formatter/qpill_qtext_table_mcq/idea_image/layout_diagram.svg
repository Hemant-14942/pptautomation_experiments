<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="520" fill="#f5f5f5"/>
  <text x="400" y="22" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">qpill_qtext_table_mcq layout</text>
  <text x="400" y="40" font-size="10" text-anchor="middle" fill="#666">from p.pptx slide 0 - question pill + text + table + 4 MCQ options</text>

  <!-- Slide canvas -->
  <rect x="20" y="50" width="760" height="450" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Question pill -->
  <rect x="0" y="58" width="147" height="33" rx="14" fill="#015500" stroke="#999" stroke-width="1"/>
  <rect x="42" y="63" width="95" height="21" rx="3" fill="white" stroke="#2563eb" stroke-width="1"/>
  <text x="89" y="77" font-size="10" font-weight="bold" text-anchor="middle" fill="#1565C0">Question</text>
  <text x="155" y="52" font-size="9" fill="#666">pill: -2.04in left, 0.75in top</text>

  <!-- Gap ~0.16in -->
  <line x1="45" y1="91" x2="45" y2="98" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="52" y="97" font-size="8" fill="#c99400">~0.16in</text>

  <!-- Question text box -->
  <rect x="45" y="98" width="722" height="42" rx="3" fill="#E3F2FD" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="115" font-size="11" font-weight="bold" fill="#1565C0">QUESTION TEXT BOX</text>
  <text x="60" y="130" font-size="9" fill="#666">1.21in left, 2.62in top | 38in x 2.8in | wrap + normAutofit</text>

  <!-- Gap ~0.57in -->
  <line x1="45" y1="140" x2="45" y2="152" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="52" y="150" font-size="8" fill="#c99400">~0.57in</text>

  <!-- Table box -->
  <rect x="45" y="152" width="722" height="75" rx="3" fill="#FFF8E1" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="170" font-size="11" font-weight="bold" fill="#E65100">TABLE BOX</text>
  <line x1="55" y1="180" x2="755" y2="180" stroke="#F57C00" stroke-width="0.5"/>
  <line x1="55" y1="195" x2="755" y2="195" stroke="#F57C00" stroke-width="0.5"/>
  <line x1="55" y1="210" x2="755" y2="210" stroke="#F57C00" stroke-width="0.5"/>
  <line x1="250" y1="175" x2="250" y2="220" stroke="#F57C00" stroke-width="0.5"/>
  <text x="60" y="225" font-size="9" fill="#666">1.21in left, 5.99in top | 38in x 5.0in | same size as input, centered in box</text>

  <!-- Gap ~1.44in -->
  <line x1="45" y1="227" x2="45" y2="245" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="52" y="240" font-size="8" fill="#c99400">~1.44in</text>

  <!-- Option A (standalone pill + label) -->
  <circle cx="70" cy="262" r="18" fill="#FF9800" opacity="0.8" stroke="#E65100" stroke-width="1.5"/>
  <text x="70" y="266" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">A</text>
  <rect x="105" y="248" width="660" height="28" rx="2" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="120" y="266" font-size="9" fill="#333">option A answer text (normAutofit)</text>
  <text x="770" y="262" font-size="8" fill="#999" text-anchor="end">standalone</text>

  <line x1="45" y1="280" x2="45" y2="290" stroke="#FFC107" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Option B (grouped) -->
  <circle cx="70" cy="302" r="18" fill="#9C27B0" opacity="0.8" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="70" y="306" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
  <rect x="105" y="288" width="660" height="28" rx="2" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="120" y="306" font-size="9" fill="#333">option B answer text</text>
  <text x="770" y="302" font-size="8" fill="#999" text-anchor="end">grouped</text>

  <line x1="45" y1="320" x2="45" y2="330" stroke="#FFC107" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Option C (grouped) -->
  <circle cx="70" cy="342" r="18" fill="#F44336" opacity="0.8" stroke="#C62828" stroke-width="1.5"/>
  <text x="70" y="346" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">C</text>
  <rect x="105" y="328" width="660" height="28" rx="2" fill="#FFEBEE" stroke="#F44336" stroke-width="1.5"/>
  <text x="120" y="346" font-size="9" fill="#333">option C answer text</text>

  <line x1="45" y1="360" x2="45" y2="370" stroke="#FFC107" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Option D (grouped) -->
  <circle cx="70" cy="382" r="18" fill="#2196F3" opacity="0.8" stroke="#1565C0" stroke-width="1.5"/>
  <text x="70" y="386" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">D</text>
  <rect x="105" y="368" width="660" height="28" rx="2" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="120" y="386" font-size="9" fill="#333">option D answer text</text>
  <text x="770" y="382" font-size="8" fill="#999" text-anchor="end">~0.57in between options</text>

  <!-- Legend -->
  <g transform="translate(20, 505)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="25" y="4" font-size="9" fill="#000">Question text</text>

    <line x1="120" y1="0" x2="138" y2="0" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="145" y="4" font-size="9" fill="#000">Table (no resize)</text>

    <rect x="280" y="-7" width="12" height="12" fill="#FF9800" opacity="0.8"/>
    <text x="297" y="4" font-size="9" fill="#000">MCQ options</text>

    <rect x="400" y="-7" width="12" height="12" fill="#015500"/>
    <text x="417" y="4" font-size="9" fill="#000">Question pill</text>
  </g>
</svg>
