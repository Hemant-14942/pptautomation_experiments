<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="520" fill="#f5f5f5"/>
  <text x="400" y="22" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">qpill_qtext_only layout</text>
  <text x="400" y="40" font-size="10" text-anchor="middle" fill="#666">from p.pptx slide 17 - question pill + question text only</text>

  <!-- Slide canvas -->
  <rect x="20" y="50" width="760" height="450" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Question pill -->
  <rect x="0" y="58" width="147" height="33" rx="14" fill="#015500" stroke="#999" stroke-width="1"/>
  <rect x="42" y="63" width="95" height="21" rx="3" fill="white" stroke="#2563eb" stroke-width="1"/>
  <text x="89" y="77" font-size="10" font-weight="bold" text-anchor="middle" fill="#1565C0">Question</text>
  <text x="155" y="52" font-size="9" fill="#666">pill: fixed position (same as all qpill types)</text>

  <!-- Gap ~0.16in -->
  <line x1="45" y1="91" x2="45" y2="98" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="52" y="97" font-size="8" fill="#c99400">~0.16in gap</text>

  <!-- Question text box (60% slide height) -->
  <rect x="45" y="98" width="722" height="270" rx="3" fill="#E3F2FD" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="115" font-size="11" font-weight="bold" fill="#1565C0">QUESTION TEXT BOX</text>
  <text x="60" y="130" font-size="9" fill="#666">1.21in left | 38in wide | 60% slide height (13.5in)</text>
  <text x="60" y="145" font-size="9" fill="#666">wrap + normAutofit | top-left aligned</text>

  <!-- Sample wrapped text lines -->
  <text x="60" y="175" font-size="10" fill="#333">17. In a measurement, it is asked to find modulus</text>
  <text x="60" y="192" font-size="10" fill="#333">of elasticity. The question text starts at the</text>
  <text x="60" y="209" font-size="10" fill="#333">top of this box and wraps to the next line...</text>

  <!-- Left margin indicator -->
  <line x1="45" y1="98" x2="45" y2="368" stroke="#4CAF50" stroke-width="1"/>
  <text x="30" y="230" font-size="8" fill="#4CAF50" text-anchor="middle" transform="rotate(-90 30 230)">1.21in</text>

  <!-- Right margin indicator -->
  <line x1="767" y1="98" x2="767" y2="368" stroke="#4CAF50" stroke-width="1"/>
  <text x="778" y="230" font-size="8" fill="#4CAF50" text-anchor="middle" transform="rotate(90 778 230)">0.79in</text>

  <!-- Height label -->
  <line x1="780" y1="98" x2="780" y2="368" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="790" y="235" font-size="9" fill="#9C27B0">60%</text>
  <text x="790" y="248" font-size="8" fill="#9C27B0">= 13.5in</text>

  <!-- Legend -->
  <g transform="translate(20, 505)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="25" y="4" font-size="9" fill="#000">Question text (wrap + shrink)</text>

    <rect x="220" y="-7" width="12" height="12" fill="#015500"/>
    <text x="237" y="4" font-size="9" fill="#000">Question pill</text>

    <line x1="340" y1="0" x2="358" y2="0" stroke="#4CAF50" stroke-width="1"/>
    <text x="365" y="4" font-size="9" fill="#000">Side margins</text>
  </g>
</svg>
