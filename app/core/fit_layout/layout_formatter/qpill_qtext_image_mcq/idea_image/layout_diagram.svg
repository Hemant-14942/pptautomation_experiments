<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="560" fill="#f5f5f5"/>
  <text x="400" y="22" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">qpill_qtext_image_mcq layout</text>
  <text x="400" y="40" font-size="10" text-anchor="middle" fill="#666">ROW 1: pill + qtext full width | ROW 2: left 50% MCQ + right 50% image</text>

  <!-- Slide canvas 40in x 22.5in (760x450px: 19px/in x, 20px/in y) -->
  <rect x="20" y="55" width="760" height="450" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Center divider at 20in (50%) - only applies below question text -->
  <line x1="400" y1="198" x2="400" y2="500" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="405" y="210" font-size="8" fill="#666">50%</text>

  <!-- ROW 1 label -->
  <text x="25" y="68" font-size="9" font-weight="bold" fill="#333">ROW 1 (full width)</text>

  <!-- Question pill -->
  <rect x="-19" y="72" width="147" height="34" rx="14" fill="#015500" stroke="#999" stroke-width="1"/>
  <rect x="42" y="77" width="95" height="21" rx="3" fill="white" stroke="#2563eb" stroke-width="1"/>
  <text x="89" y="91" font-size="10" font-weight="bold" text-anchor="middle" fill="#1565C0">Question</text>

  <!-- Question text full width -->
  <rect x="43" y="108" width="722" height="90" rx="3" fill="#E3F2FD" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="58" y="126" font-size="11" font-weight="bold" fill="#1565C0">QUESTION TEXT</text>
  <text x="58" y="142" font-size="9" fill="#666">1.21in L | 2.62in T | 38in x 4.8in | wrap + normAutofit</text>
  <text x="58" y="170" font-size="9" fill="#333">Full width with left/right margins</text>

  <!-- ROW 2 label -->
  <text x="25" y="210" font-size="9" font-weight="bold" fill="#333">ROW 2 (50% + 50% split)</text>
  <text x="200" y="210" font-size="8" fill="#666">LEFT: MCQ answers</text>
  <text x="520" y="210" font-size="8" fill="#666">RIGHT: image only</text>

  <!-- Gap 1.44in question to row 2 -->
  <line x1="43" y1="198" x2="43" y2="218" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="48" y="212" font-size="7" fill="#c99400">1.44in</text>

  <!-- LEFT 50%: MCQ zone background -->
  <rect x="43" y="220" width="350" height="270" rx="2" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="55" y="235" font-size="8" fill="#888">LEFT 50% - MCQ zone</text>

  <!-- Option A -->
  <circle cx="62" cy="255" r="16" fill="#FF9800" opacity="0.9" stroke="#E65100" stroke-width="1.5"/>
  <text x="62" y="259" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">A</text>
  <rect x="85" y="245" width="295" height="22" rx="2" fill="#FFF3E0" stroke="#FF9800" stroke-width="1.5"/>
  <text x="98" y="260" font-size="9" fill="#333">answer A (left 50% only)</text>

  <line x1="48" y1="272" x2="48" y2="282" stroke="#FFC107" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="53" y="280" font-size="7" fill="#c99400">2.32in</text>

  <!-- Option B -->
  <circle cx="62" cy="298" r="16" fill="#9C27B0" opacity="0.9" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="62" y="302" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
  <rect x="85" y="288" width="295" height="22" rx="2" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="98" y="303" font-size="9" fill="#333">answer B wrap + normAutofit</text>

  <line x1="48" y1="315" x2="48" y2="325" stroke="#FFC107" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Option C -->
  <circle cx="62" cy="341" r="16" fill="#F44336" opacity="0.9" stroke="#C62828" stroke-width="1.5"/>
  <text x="62" y="345" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">C</text>
  <rect x="85" y="331" width="295" height="22" rx="2" fill="#FFEBEE" stroke="#F44336" stroke-width="1.5"/>
  <text x="98" y="346" font-size="9" fill="#333">answer C</text>

  <line x1="48" y1="358" x2="48" y2="368" stroke="#FFC107" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Option D -->
  <circle cx="62" cy="384" r="16" fill="#2196F3" opacity="0.9" stroke="#1565C0" stroke-width="1.5"/>
  <text x="62" y="388" font-size="10" font-weight="bold" text-anchor="middle" fill="#fff">D</text>
  <rect x="85" y="374" width="295" height="22" rx="2" fill="#E3F2FD" stroke="#2196F3" stroke-width="1.5"/>
  <text x="98" y="389" font-size="9" fill="#333">answer D</text>
  <text x="55" y="410" font-size="8" fill="#666">answer width: left 50% (3.40in L to center)</text>

  <!-- RIGHT 50%: Image box (no overlap with question text) -->
  <rect x="408" y="220" width="355" height="270" rx="3" fill="#FFF8E1" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="585" y="340" font-size="12" font-weight="bold" text-anchor="middle" fill="#E65100">IMAGE BOX</text>
  <text x="585" y="358" font-size="9" text-anchor="middle" fill="#666">RIGHT 50% only</text>
  <text x="585" y="373" font-size="9" text-anchor="middle" fill="#666">starts at MCQ row (8.87in T)</text>
  <text x="585" y="388" font-size="9" text-anchor="middle" fill="#666">spans MCQ zone height</text>
  <text x="585" y="403" font-size="9" text-anchor="middle" fill="#666">aspect ratio kept</text>

  <!-- Structure summary -->
  <rect x="20" y="515" width="760" height="38" rx="3" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="30" y="532" font-size="9" fill="#333">Structure: [pill + qtext full width] then [MCQ left 50% | image right 50%]</text>
  <text x="30" y="546" font-size="9" fill="#666">All text: wrap=square then normAutofit, top-left align</text>

  <!-- Legend -->
  <g transform="translate(20, 555)">
    <line x1="0" y1="0" x2="16" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="22" y="4" font-size="8" fill="#000">Question text</text>
    <line x1="110" y1="0" x2="126" y2="0" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="132" y="4" font-size="8" fill="#000">Image</text>
    <rect x="200" y="-6" width="10" height="10" fill="#FF9800" opacity="0.9"/>
    <text x="215" y="4" font-size="8" fill="#000">MCQ</text>
    <rect x="270" y="-6" width="10" height="10" fill="#015500"/>
    <text x="285" y="4" font-size="8" fill="#000">Pill</text>
  </g>
</svg>
