<svg viewBox="0 0 2400 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="1200" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#333">Question Pill Layout on 40" × 22.5" Slide</text>

  <!-- Slide canvas background -->
  <rect x="100" y="80" width="2200" height="1000" fill="#f5f5f5" stroke="#333" stroke-width="2"/>

  <!-- Slide dimensions label -->
  <text x="50" y="600" font-size="14" fill="#666">40"</text>
  <text x="1200" y="1140" font-size="14" fill="#666" text-anchor="middle">22.5"</text>

  <!-- Question Pill (rounded rectangle) -->
  <!-- Pill starts at x=-2.039" (extends left of slide), y=0.746" from top -->
  <!-- Size: 7.745" × 1.717" -->
  <g>
    <!-- The pill shape (extends beyond left edge) -->
    <rect x="-150" y="200" width="400" height="95" rx="20" fill="#4CAF50" opacity="0.7" stroke="#333" stroke-width="2"/>

    <!-- Question Label text box (inside the pill) -->
    <!-- Position: x=1.137", y=0.904" -->
    <!-- Size: 4.989" × 1.111" -->
    <rect x="320" y="230" width="250" height="55" fill="#fff" stroke="#333" stroke-width="1" opacity="0.9"/>
    <text x="445" y="265" font-size="16" font-weight="bold" text-anchor="middle" fill="#000">Question</text>
  </g>

  <!-- Position annotations -->
  <g stroke="#E91E63" stroke-width="1" stroke-dasharray="3,3" fill="none">
    <!-- X position line for pill -->
    <line x1="100" y1="200" x2="100" y2="95"/>
    <text x="50" y="140" font-size="12" fill="#E91E63">x = -2.039"</text>

    <!-- Y position line for pill -->
    <line x1="100" y1="200" x2="80" y2="200"/>
    <text x="20" y="210" font-size="12" fill="#E91E63">y = 0.746"</text>
  </g>

  <!-- Size annotations -->
  <g stroke="#2196F3" stroke-width="1" stroke-dasharray="3,3" fill="none">
    <!-- Width annotation -->
    <line x1="-150" y1="150" x2="250" y2="150"/>
    <text x="50" y="140" font-size="12" fill="#2196F3">Width: 7.745"</text>

    <!-- Height annotation -->
    <line x1="-180" y1="200" x2="-180" y2="295"/>
    <text x="-250" y="250" font-size="12" fill="#2196F3">H: 1.717"</text>
  </g>

  <!-- Key information box -->
  <g>
    <rect x="100" y="1050" width="2200" height="90" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="5"/>
    <text x="120" y="1080" font-size="13" font-weight="bold" fill="#1976D2">Key Points:</text>
    <text x="120" y="1105" font-size="12" fill="#333">• Pill extends beyond slide left edge (negative X = -2.039")</text>
    <text x="680" y="1105" font-size="12" fill="#333">• Label text sits inside pill bounds</text>
    <text x="1400" y="1105" font-size="12" fill="#333">• Fixed position used for all question slides</text>
  </g>
</svg>
