<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#f5f5f5"/>

  <!-- Slide Canvas (40" × 22.5") -->
  <rect x="20" y="20" width="760" height="410" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Title/Heading Pill (Green rounded bar at top) -->
  <rect x="45" y="40" width="380" height="50" rx="8" fill="#015500" stroke="#999" stroke-width="1"/>
  <text x="235" y="72" font-size="16" font-weight="bold" text-anchor="middle" fill="white">HEADING PILL</text>
  <text x="235" y="28" font-size="11" text-anchor="middle" fill="#666" font-weight="500">Title Box (Don't Touch)</text>

  <!-- Body Content Textbox (Left side) -->
  <rect x="45" y="115" width="420" height="290" rx="4" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="135" font-size="13" font-weight="bold" fill="#2563eb">BODY CONTENT TEXTBOX</text>
  <text x="60" y="155" font-size="11" fill="#666">• Bullet point 1</text>
  <text x="60" y="175" font-size="11" fill="#666">• Bullet point 2</text>
  <text x="60" y="195" font-size="11" fill="#666">• Bullet point 3</text>
  <text x="60" y="215" font-size="11" fill="#666">• Bullet point 4</text>
  <text x="60" y="250" font-size="10" fill="#888" font-style="italic">(Text wraps here)</text>
  <text x="60" y="300" font-size="10" fill="#888">Size: 23.4" × 19"</text>
  <text x="60" y="318" font-size="10" fill="#888">Position: 1" left, 5.15" top</text>

  <!-- Image Textbox (Right side) -->
  <rect x="495" y="145" width="270" height="145" rx="4" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="510" y="165" font-size="13" font-weight="bold" fill="#ea580c">IMAGE TEXTBOX</text>
  <circle cx="630" cy="210" r="35" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="630" y="215" font-size="11" text-anchor="middle" fill="#666">[Image]</text>
  <text x="510" y="310" font-size="10" fill="#888">Size: 13" × 8.2"</text>
  <text x="510" y="328" font-size="10" fill="#888">Position: 25.2" left</text>

  <!-- Legend -->
  <g transform="translate(20, 420)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="30" y="5" font-size="11" fill="#000">Body (wrap mode on)</text>

    <line x1="280" y1="0" x2="300" y2="0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="310" y="5" font-size="11" fill="#000">Image (resize to fit)</text>

    <rect x="550" y="-7" width="15" height="15" fill="#015500"/>
    <text x="570" y="5" font-size="11" fill="#000">Heading (unchanged)</text>
  </g>
</svg>
