<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="470" fill="#f5f5f5"/>

  <!-- Slide Canvas (40" x 22.5"), extracted from p.pptx slide 29 (index 28) -->
  <rect x="20" y="20" width="760" height="427" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Question Pill (bleeds off the left edge, same convention as heading pill) -->
  <rect x="0" y="35" width="147" height="33" rx="14" fill="#015500" stroke="#999" stroke-width="1"/>
  <rect x="42" y="40" width="95" height="21" rx="3" fill="white" stroke="#2563eb" stroke-width="1"/>
  <text x="89" y="54" font-size="10" font-weight="bold" text-anchor="middle" fill="#1565C0">Question</text>
  <text x="150" y="26" font-size="10" fill="#666">Question pill: x=-2.04in y=0.75in w=7.74in h=1.72in (label inside)</text>

  <!-- Gap 1 -->
  <line x1="45" y1="68" x2="45" y2="87" stroke="#FFC107" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="52" y="80" font-size="10" fill="#c99400">gap ~1.4in</text>

  <!-- Question text box -->
  <rect x="45" y="87" width="722" height="83" rx="4" fill="#E3F2FD" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="60" y="105" font-size="12" font-weight="bold" fill="#1565C0">QUESTION TEXT BOX</text>
  <text x="60" y="123" font-size="10" fill="#666">left-aligned, wrap on, 4-5 lines</text>
  <text x="60" y="140" font-size="10" fill="#888" font-style="italic">auto-fit: shrink font if content overflows box</text>
  <text x="60" y="160" font-size="10" fill="#888">Position: 1.21in left, 2.62in top  Size: 38.0in x 4.8in</text>

  <!-- Gap 2 -->
  <line x1="45" y1="170" x2="45" y2="199" stroke="#FFC107" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="52" y="188" font-size="10" fill="#c99400">gap ~1.4in before options</text>

  <!-- Option A: standalone ellipse + standalone label (NOT grouped in source pptx) -->
  <circle cx="70" cy="216" r="24" fill="#FF9800" opacity="0.8" stroke="#E65100" stroke-width="2"/>
  <text x="70" y="221" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">A</text>
  <rect x="120" y="199" width="647" height="34" rx="3" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="135" y="220" font-size="11" fill="#333">option A answer text (full remaining width, wrap on)</text>
  <text x="770" y="216" font-size="9" fill="#999" text-anchor="end">standalone (pill + "A" label are separate shapes)</text>

  <!-- Gap between options -->
  <line x1="45" y1="240" x2="45" y2="256" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Option B: grouped ellipse+label (translate as one unit) -->
  <g>
    <circle cx="70" cy="272" r="24" fill="#9C27B0" opacity="0.8" stroke="#6A1B9A" stroke-width="2"/>
    <text x="70" y="277" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">B</text>
  </g>
  <rect x="120" y="255" width="647" height="34" rx="3" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="135" y="276" font-size="11" fill="#333">option B answer text</text>
  <text x="770" y="272" font-size="9" fill="#999" text-anchor="end">grouped (grpSp: ellipse + "B" label move as one)</text>

  <line x1="45" y1="296" x2="45" y2="312" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Option C: grouped -->
  <g>
    <circle cx="70" cy="328" r="24" fill="#F44336" opacity="0.8" stroke="#C62828" stroke-width="2"/>
    <text x="70" y="333" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">C</text>
  </g>
  <rect x="120" y="311" width="647" height="34" rx="3" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
  <text x="135" y="332" font-size="11" fill="#333">option C answer text</text>
  <text x="770" y="328" font-size="9" fill="#999" text-anchor="end">grouped (grpSp: ellipse + "C" label move as one)</text>

  <line x1="45" y1="352" x2="45" y2="368" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Option D: grouped -->
  <g>
    <circle cx="70" cy="384" r="24" fill="#2196F3" opacity="0.8" stroke="#1565C0" stroke-width="2"/>
    <text x="70" y="389" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">D</text>
  </g>
  <rect x="120" y="367" width="647" height="34" rx="3" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="135" y="388" font-size="11" fill="#333">option D answer text</text>
  <text x="770" y="384" font-size="9" fill="#999" text-anchor="end">grouped (grpSp: ellipse + "D" label move as one)</text>

  <!-- Legend -->
  <g transform="translate(20, 452)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="30" y="4" font-size="10" fill="#000">Text box (wrap on, left align)</text>

    <rect x="260" y="-8" width="15" height="15" fill="#9C27B0" opacity="0.8"/>
    <text x="280" y="4" font-size="10" fill="#000">Grouped pill+label: place_group() translation</text>

    <rect x="560" y="-8" width="15" height="15" fill="#FF9800" opacity="0.8"/>
    <text x="580" y="4" font-size="10" fill="#000">Standalone pill+label: clone_and_place() x2</text>
  </g>
</svg>
