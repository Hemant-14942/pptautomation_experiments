<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="540" fill="#f5f5f5"/>
  <text x="400" y="22" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">title_image_only layout</text>
  <text x="400" y="40" font-size="10" text-anchor="middle" fill="#666">heading pill + images below (same grid rules as image_only)</text>

  <rect x="20" y="55" width="760" height="450" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Heading pill -->
  <rect x="38" y="62" width="700" height="28" rx="14" fill="#015500" stroke="#999" stroke-width="1"/>
  <text x="388" y="80" font-size="11" font-weight="bold" text-anchor="middle" fill="white">HEADING PILL (unchanged)</text>
  <text x="25" y="58" font-size="8" fill="#666">1in L, 0.79in T</text>

  <!-- Gap to image area -->
  <line x1="58" y1="90" x2="58" y2="108" stroke="#FFC107" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="63" y="102" font-size="7" fill="#c99400">starts 5.15in</text>

  <!-- Content area below heading -->
  <rect x="58" y="108" width="684" height="380" rx="2" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="70" y="124" font-size="9" fill="#888">IMAGE CONTENT AREA (2in L/R margins, 2in bottom)</text>

  <!-- Left/right margin markers -->
  <line x1="58" y1="108" x2="58" y2="488" stroke="#4CAF50" stroke-width="1"/>
  <text x="48" y="300" font-size="7" fill="#4CAF50" text-anchor="middle" transform="rotate(-90 48 300)">2in</text>
  <line x1="742" y1="108" x2="742" y2="488" stroke="#4CAF50" stroke-width="1"/>
  <text x="752" y="300" font-size="7" fill="#4CAF50">2in</text>

  <!-- Example: 1 image centered -->
  <rect x="220" y="180" width="360" height="200" rx="3" fill="#FFF8E1" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="275" font-size="11" font-weight="bold" text-anchor="middle" fill="#E65100">1 IMAGE</text>
  <text x="400" y="292" font-size="9" text-anchor="middle" fill="#666">centered in area (60% fill)</text>

  <!-- Grid hint -->
  <text x="70" y="450" font-size="9" fill="#333">2 images: left | right</text>
  <text x="70" y="465" font-size="9" fill="#333">3 images: 2 top + 1 bottom center</text>
  <text x="70" y="480" font-size="9" fill="#333">4 images: 2x2 grid | 5+: auto grid</text>
  <text x="400" y="450" font-size="9" fill="#666">aspect ratio kept, image centered in each slot</text>

  <g transform="translate(20, 520)">
    <rect x="0" y="-7" width="12" height="12" fill="#015500"/>
    <text x="17" y="4" font-size="9" fill="#000">Heading pill</text>
    <line x1="110" y1="0" x2="128" y2="0" stroke="#F57C00" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="135" y="4" font-size="9" fill="#000">Image slots</text>
    <line x1="230" y1="0" x2="248" y2="0" stroke="#4CAF50" stroke-width="1"/>
    <text x="255" y="4" font-size="9" fill="#000">2in margins</text>
  </g>
</svg>
