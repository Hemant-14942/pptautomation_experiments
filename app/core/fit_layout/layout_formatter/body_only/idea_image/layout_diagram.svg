<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="470" fill="#f5f5f5"/>

  <!-- Slide canvas: 40in wide x 22.5in tall -->
  <rect x="20" y="20" width="760" height="427" fill="white" stroke="#ccc" stroke-width="2"/>

  <!-- Top gap (1 inch margin) -->
  <line x1="45" y1="35" x2="45" y2="50" stroke="#FFC107" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="52" y="45" font-size="10" fill="#c99400">top gap ~1in</text>

  <!-- The ONE text box - fills the whole slide minus margins -->
  <rect x="45" y="50" width="710" height="367" rx="4" fill="#E3F2FD" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Sample text centered vertically inside the box -->
  <text x="400" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565C0">BODY CONTENT ONLY</text>
  <text x="400" y="225" font-size="11" text-anchor="middle" fill="#666">No heading pill on this slide type</text>
  <text x="400" y="250" font-size="11" text-anchor="middle" fill="#666">Bullet 1, Bullet 2, Bullet 3</text>
  <text x="400" y="280" font-size="10" text-anchor="middle" fill="#888" font-style="italic">vertically centered - equal gap top and bottom</text>

  <!-- Size labels -->
  <text x="60" y="380" font-size="10" fill="#888">Position: 1in left, 1in top</text>
  <text x="60" y="395" font-size="10" fill="#888">Size: 38in x 20.5in (full slide minus 1in margins)</text>
  <text x="60" y="410" font-size="10" fill="#888">wrap=square, anchor=ctr, normAutofit on overflow</text>

  <!-- Bottom gap (1 inch margin) -->
  <line x1="45" y1="417" x2="45" y2="432" stroke="#FFC107" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="52" y="430" font-size="10" fill="#c99400">bottom gap ~1in</text>

  <!-- Left margin indicator -->
  <line x1="20" y1="50" x2="45" y2="50" stroke="#999" stroke-width="1"/>
  <text x="25" y="45" font-size="9" fill="#999">1in</text>

  <!-- Width indicator -->
  <line x1="45" y1="445" x2="755" y2="445" stroke="#999" stroke-width="1"/>
  <line x1="45" y1="440" x2="45" y2="450" stroke="#999" stroke-width="1"/>
  <line x1="755" y1="440" x2="755" y2="450" stroke="#999" stroke-width="1"/>
  <text x="400" y="460" font-size="10" text-anchor="middle" fill="#999">38in full width (1in margin each side)</text>

  <!-- Legend -->
  <g transform="translate(20, 452)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="30" y="4" font-size="10" fill="#000">Body textbox (full slide, v-center, auto-shrink)</text>
  </g>
</svg>
